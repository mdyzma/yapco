# YAPCO with Docker (docs/operations/deploy.md). From the repository root:
#
#   docker compose -f deploy/docker/compose.yaml up -d --build
#
# then open http://localhost:8080. Settings go in environment variables or a .env file next to
# this one (see .env.example).
name: yapco

services:
  yapco:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-docker}
    image: yapco:local
    ports:
      - '${YAPCO_BIND:-127.0.0.1}:${YAPCO_PORT:-8080}:8080'
    environment:
      YAPCO_PORT: ${YAPCO_PORT:-8080}
      YAPCO_ORIGIN: ${YAPCO_ORIGIN:-}
    # Chromium needs more shared memory than Docker's 64 MB default for large planners.
    shm_size: 1gb
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
